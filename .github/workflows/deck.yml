name: build-deck
on:
  push:
    paths: ["docs/make_deck.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-pptx==1.0.2
      - run: python docs/make_deck.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRISM-Gate.pptx
          git commit -m "Build pitch deck" || echo "no change"
          git push
